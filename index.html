<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sites</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f5f4f1;
    --card: #fff;
    --text: #1b1d20;
    --muted: #5d6268;
    --line: #dcd8d0;
    --accent: #c8481b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; }
  h1 { margin: 0 0 2rem; font-size: 2rem; letter-spacing: -.02em; }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .75rem; }
  a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 1.1rem 1.25rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: inherit;
    text-decoration: none;
  }
  a:hover { border-color: var(--text); }
  a:hover .go { color: var(--accent); }
  strong { display: block; }
  span { color: var(--muted); font-size: .9rem; }
  .go { font-size: 1.25rem; }
</style>
</head>
<body>
<main>
  <h1>Sites</h1>
  <ul>
    <li>
      <a href="sublimotors/">
        <div><strong>SUBLIMOTORS</strong><span>Agence automobile · Rueil-Malmaison</span></div>
        <span class="go" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
